<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Brass/Clay Gradient for Saki -->
    <linearGradient id="sakiClay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Flame Gradient -->
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <filter id="lampShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#451a03" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient light glow behind flame -->
  <circle cx="100" cy="70" r="60" fill="url(#ambientHalo)" class="saki-glow-aura"/>

  <g filter="url(#lampShadow)">
    <!-- Base stand -->
    <ellipse cx="100" cy="170" rx="42" ry="10" fill="url(#sakiClay)"/>
    <path d="M80,170 C80,155 92,145 92,130 L108,130 C108,145 120,155 120,170 Z" fill="url(#sakiClay)"/>

    <!-- Lamp Bowl (Saki) -->
    <path d="M45,120 C45,150 155,150 155,120 C140,135 60,135 45,120 Z" fill="url(#sakiClay)"/>
    <ellipse cx="100" cy="120" rx="55" ry="16" fill="url(#sakiClay)"/>
    <!-- Oil surface pool -->
    <ellipse cx="100" cy="118" rx="46" ry="12" fill="#78350f"/>
    <ellipse cx="100" cy="117" rx="42" ry="10" fill="#92400e"/>

    <!-- Cotton Wick (Solita) -->
    <path d="M100,120 Q100,98 100,88" stroke="#fef3c7" stroke-width="3" stroke-linecap="round"/>

    <!-- Sacred Flame (Pradip Shika) -->
    <g class="saki-flame-group">
      <path d="M100,50 C92,68 85,82 85,95 C85,108 92,116 100,116 C108,116 115,108 115,95 C115,82 108,68 100,50 Z" fill="url(#flameGlow)"/>
      <path d="M100,65 C95,76 90,86 90,95 C90,103 95,108 100,108 C105,108 110,103 110,95 C110,86 105,76 100,65 Z" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>
</svg>
